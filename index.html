<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estrellas de Angela & Fer 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Fredoka+One&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #020010;
    font-family: 'Fredoka One', cursive;
    overflow-x: hidden;
  }

  /* ══ FONDO ESPACIO ══ */
  #space {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, #1a0a3a 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, #0a1a3a 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #120820 0%, transparent 70%),
      linear-gradient(180deg, #020010 0%, #0a0520 50%, #020010 100%);
    z-index: 0;
  }

  /* Nebulas */
  .nebula {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    animation: nebulaPulse ease-in-out infinite;
  }
  @keyframes nebulaPulse {
    0%,100%{ opacity: var(--op,0.12); transform: scale(1); }
    50%    { opacity: calc(var(--op,0.12) * 1.4); transform: scale(1.05); }
  }

  /* Estrellas de fondo */
  .bg-star {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    animation: starTwinkle ease-in-out infinite;
  }
  @keyframes starTwinkle {
    0%,100%{ opacity: 0.1; transform: scale(1); }
    50%    { opacity: 1;   transform: scale(1.6); }
  }

  /* Estrella fugaz */
  .shooting-star {
    position: fixed;
    height: 2px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 3;
    animation: shootStar linear forwards;
  }
  @keyframes shootStar {
    0%  { opacity: 1; transform: translateX(0) translateY(0) rotate(-25deg); }
    100%{ opacity: 0; transform: translateX(250px) translateY(100px) rotate(-25deg); }
  }

  /* Planeta decorativo */
  .planet {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    animation: planetFloat ease-in-out infinite;
  }
  @keyframes planetFloat {
    0%,100%{ transform: translateY(0); }
    50%    { transform: translateY(-8px); }
  }

  /* ══ CONTENIDO ══ */
  .page-wrap {
    position: relative; z-index: 5;
    padding: 20px 16px 80px;
    min-height: 100vh;
  }

  /* Header */
  #header {
    text-align: center;
    padding: 30px 0 35px;
  }
  .header-title {
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(2.4rem,8vw,3.8rem);
    color: #f7d6e0;
    text-shadow:
      0 0 30px rgba(255,100,180,0.6),
      0 0 60px rgba(200,100,255,0.3),
      2px 2px 0 rgba(0,0,0,0.5);
    line-height: 1.1;
    animation: titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%,100%{ text-shadow: 0 0 30px rgba(255,100,180,0.6), 0 0 60px rgba(200,100,255,0.3), 2px 2px 0 rgba(0,0,0,0.5); }
    50%    { text-shadow: 0 0 50px rgba(255,100,180,0.9), 0 0 100px rgba(200,100,255,0.5), 2px 2px 0 rgba(0,0,0,0.5); }
  }
  .header-sub {
    font-family: 'Lora', serif;
    font-style: italic;
    color: rgba(200,180,255,0.75);
    font-size: clamp(0.8rem,2.5vw,1rem);
    margin-top: 10px;
    letter-spacing: 1px;
  }
  .header-heart {
    display: block;
    font-size: 1.8rem;
    margin-top: 12px;
    animation: heartBeat 2s ease-in-out infinite;
    filter: drop-shadow(0 0 12px #ff4d7d);
  }
  @keyframes heartBeat {
    0%,100%{ transform: scale(1); }
    50%    { transform: scale(1.15); }
  }

  /* ══ GRID ESTRELLAS ══ */
  .stars-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px 20px;
    max-width: 500px;
    margin: 0 auto;
    padding: 0 8px;
  }

  /* ══ ESTRELLA INTERACTIVA ══ */
  .star-btn {
    position: relative;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: starFloat var(--float-dur,6s) ease-in-out infinite;
    animation-delay: var(--float-delay,0s);
    transition: transform 0.15s ease;
  }
  .star-btn:active { transform: scale(0.9); }

  @keyframes starFloat {
    0%,100%{ transform: translateY(0) rotate(var(--tilt,0deg)); }
    50%    { transform: translateY(-14px) rotate(var(--tilt,0deg)); }
  }

  /* SVG de estrella */
  .star-svg-wrap {
    position: relative;
    width: clamp(90px, 22vw, 130px);
    height: clamp(90px, 22vw, 130px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .star-svg-wrap svg {
    width: 100%; height: 100%;
    transition: filter 0.2s ease;
    filter:
      drop-shadow(0 0 8px var(--glow-color, #fff9c4))
      drop-shadow(0 0 20px var(--glow-color, #fff9c4));
  }
  .star-btn:hover .star-svg-wrap svg,
  .star-btn:active .star-svg-wrap svg {
    filter:
      drop-shadow(0 0 14px var(--glow-color, #fff9c4))
      drop-shadow(0 0 35px var(--glow-color, #fff9c4))
      drop-shadow(0 0 60px var(--glow-color, #fff9c4));
  }

  /* Emoji e interior */
  .star-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    pointer-events: none;
  }
  .star-emoji {
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    line-height: 1;
    animation: emojiSpin 8s linear infinite;
  }
  @keyframes emojiSpin {
    0%  { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(5deg) scale(1.1); }
    100%{ transform: rotate(0deg) scale(1); }
  }

  /* Etiqueta debajo de la estrella */
  .star-label {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(0.85rem, 2.8vw, 1.1rem);
    color: #f0e0ff;
    text-shadow:
      0 0 10px var(--glow-color, #fff9c4),
      0 1px 0 rgba(0,0,0,0.5);
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* Anillo orbital */
  .star-orbit {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.12);
    animation: orbitSpin 12s linear infinite;
    pointer-events: none;
  }
  .star-orbit::after {
    content: '·';
    position: absolute;
    top: -4px; left: 50%;
    transform: translateX(-50%);
    color: var(--glow-color, #fff9c4);
    font-size: 1rem;
    text-shadow: 0 0 8px var(--glow-color, #fff9c4);
  }
  @keyframes orbitSpin { to { transform: rotate(360deg); } }

  /* ══ OVERLAY CARTA ══ */
  #letter-overlay {
    position: fixed; inset: 0;
    background: rgba(5, 0, 20, 0.75);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #letter-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .letter-card {
    background: linear-gradient(160deg, #fff9f5, #fff0f8, #f5f0ff);
    border-radius: 20px;
    padding: 34px 26px 24px;
    max-width: 360px;
    width: 100%;
    position: relative;
    box-shadow:
      0 30px 80px rgba(150,50,255,0.25),
      0 0 0 1px rgba(200,150,255,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.8);
    transform: scale(0.6) translateY(50px) rotate(-3deg);
    transition: transform 0.5s cubic-bezier(0.34,1.4,0.64,1);
  }
  #letter-overlay.open .letter-card {
    transform: scale(1) translateY(0) rotate(0deg);
  }

  /* Estrella deco arriba */
  .letter-star-deco {
    position: absolute;
    top: -22px; left: 50%;
    transform: translateX(-50%);
    font-size: 2.5rem;
    filter: drop-shadow(0 0 12px var(--deco-color, #ffd700));
    animation: heartBeat 2s ease-in-out infinite;
  }

  /* Borde punteado */
  .letter-card::before {
    content:''; position:absolute; inset:10px;
    border: 1.5px dashed rgba(180,100,220,0.25);
    border-radius:14px; pointer-events:none;
  }

  .letter-title {
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(1.8rem,6vw,2.4rem);
    color: #7020b0;
    text-align: center;
    text-shadow: 1px 1px 0 #f3e0ff;
    margin-bottom: 14px;
    line-height: 1.1;
  }

  .letter-divider {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px;
  }
  .letter-divider::before, .letter-divider::after {
    content:''; flex:1; height:1px;
    background: linear-gradient(to right, transparent, #c8a0e8, transparent);
  }

  .letter-body {
    font-family: 'Lora', serif; font-style: italic;
    color: #3a1a5a;
    font-size: clamp(0.88rem,2.5vw,1rem);
    line-height: 1.85; text-align: center;
  }
  .letter-body p + p { margin-top: 12px; }

  .letter-sign {
    margin-top: 18px; text-align: right;
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(1.3rem,4vw,1.7rem);
    color: #8030c0;
  }

  .letter-border {
    height: 5px; margin-top: 16px;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(90deg, #c084fc, #a855f7, #7c3aed, #a855f7, #c084fc);
    background-size: 200% 100%;
    animation: borderSlide 3s linear infinite;
  }
  @keyframes borderSlide { 0%{ background-position:0% } 100%{ background-position:200% } }

  .letter-close {
    position: absolute; top: 14px; right: 14px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(150,50,220,0.12);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; color: #8030c0;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .letter-close:hover { background: rgba(150,50,220,0.25); }

  /* Partícula */
  .pop-particle {
    position: fixed; pointer-events: none; z-index: 200;
    animation: popOut 0.9s ease-out forwards;
  }
  @keyframes popOut {
    0%  { transform: translate(0,0) scale(0) rotate(0deg); opacity:1; }
    60% { opacity: 1; }
    100%{ transform: translate(var(--tx),var(--ty)) scale(1) rotate(var(--rot,20deg)); opacity:0; }
  }

  /* Footer */
  #footer {
    position: relative; z-index: 5;
    text-align: center; padding: 10px 0 50px;
  }
  .footer-text {
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(1.3rem,4vw,1.8rem);
    color: rgba(200,170,255,0.65);
    text-shadow: 0 0 20px rgba(180,100,255,0.3);
  }
</style>
</head>
<body>

<div id="space"></div>

<div class="page-wrap">

  <div id="header">
    <div class="header-title">Angela & Fer</div>
    <div class="header-sub">toca una estrella para leer tu carta 💕</div>
    <span class="header-heart">💕</span>
  </div>

  <div class="stars-grid">

    <!-- Estrella 1 — Amor -->
    <div class="star-btn" data-id="1"
         style="--float-dur:6s;--float-delay:0s;--tilt:-2deg;--glow-color:#ff85c2">
      <div class="star-svg-wrap">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sg1" cx="40%" cy="35%" r="65%">
              <stop offset="0%"   stop-color="#fff0f8"/>
              <stop offset="60%"  stop-color="#ffb3d9"/>
              <stop offset="100%" stop-color="#e8569a"/>
            </radialGradient>
          </defs>
          <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
            fill="url(#sg1)" stroke="rgba(255,200,230,0.6)" stroke-width="1"/>
        </svg>
        <div class="star-inner">
          <div class="star-emoji">💕</div>
        </div>
        <div class="star-orbit" style="--glow-color:#ff85c2"></div>
      </div>
      <div class="star-label" style="--glow-color:#ff85c2">Amor</div>
    </div>

    <!-- Estrella 2 — Risa -->
    <div class="star-btn" data-id="2"
         style="--float-dur:7.5s;--float-delay:1s;--tilt:2deg;--glow-color:#ffd966">
      <div class="star-svg-wrap">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sg2" cx="40%" cy="35%" r="65%">
              <stop offset="0%"   stop-color="#fffde7"/>
              <stop offset="60%"  stop-color="#ffe066"/>
              <stop offset="100%" stop-color="#f9a825"/>
            </radialGradient>
          </defs>
          <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
            fill="url(#sg2)" stroke="rgba(255,230,100,0.6)" stroke-width="1"/>
        </svg>
        <div class="star-inner">
          <div class="star-emoji">😊</div>
        </div>
        <div class="star-orbit" style="--glow-color:#ffd966"></div>
      </div>
      <div class="star-label" style="--glow-color:#ffd966">Risa</div>
    </div>

    <!-- Estrella 3 — Calma -->
    <div class="star-btn" data-id="3"
         style="--float-dur:8s;--float-delay:0.5s;--tilt:-1.5deg;--glow-color:#80d8ff">
      <div class="star-svg-wrap">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sg3" cx="40%" cy="35%" r="65%">
              <stop offset="0%"   stop-color="#e0f7ff"/>
              <stop offset="60%"  stop-color="#81d4fa"/>
              <stop offset="100%" stop-color="#0288d1"/>
            </radialGradient>
          </defs>
          <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
            fill="url(#sg3)" stroke="rgba(150,220,255,0.6)" stroke-width="1"/>
        </svg>
        <div class="star-inner">
          <div class="star-emoji">🕊️</div>
        </div>
        <div class="star-orbit" style="--glow-color:#80d8ff"></div>
      </div>
      <div class="star-label" style="--glow-color:#80d8ff">Calma</div>
    </div>

    <!-- Estrella 4 — Hogar -->
    <div class="star-btn" data-id="4"
         style="--float-dur:9s;--float-delay:1.8s;--tilt:1.5deg;--glow-color:#b39ddb">
      <div class="star-svg-wrap">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sg4" cx="40%" cy="35%" r="65%">
              <stop offset="0%"   stop-color="#f3e5ff"/>
              <stop offset="60%"  stop-color="#ce93d8"/>
              <stop offset="100%" stop-color="#7b1fa2"/>
            </radialGradient>
          </defs>
          <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
            fill="url(#sg4)" stroke="rgba(200,150,255,0.6)" stroke-width="1"/>
        </svg>
        <div class="star-inner">
          <div class="star-emoji">🏠</div>
        </div>
        <div class="star-orbit" style="--glow-color:#b39ddb"></div>
      </div>
      <div class="star-label" style="--glow-color:#b39ddb">Hogar</div>
    </div>

    <!-- Estrella 5 — Magia -->
    <div class="star-btn" data-id="5"
         style="--float-dur:7s;--float-delay:2.2s;--tilt:-2.5deg;--glow-color:#a5f3a5">
      <div class="star-svg-wrap">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sg5" cx="40%" cy="35%" r="65%">
              <stop offset="0%"   stop-color="#e8ffe8"/>
              <stop offset="60%"  stop-color="#80e880"/>

        </svg>
        <div class="star-inner">
          <div class="star-emoji">✨</div>
        </div>
        <div class="star-orbit" style="--glow-color:#a5f3a5"></div>
      </div>
      <div class="star-label" style="--glow-color:#a5f3a5">Magia</div>

    <!-- Estrella 6 — Siempre -->
    <div class="star-btn" data-id="6"
         style="--float-dur:8.5s;--float-delay:0.8s;--tilt:2.5deg;--glow-color:#ffcc80">
      <div class="star-svg-wrap">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sg6" cx="40%" cy="35%" r="65%">

          <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
            fill="url(#sg6)" stroke="rgba(255,200,120,0.6)" stroke-width="1"/>
        </svg>
        <div class="star-inner">
          <div class="star-emoji">🌟</div>
        </div>
        <div class="star-orbit" style="--glow-color:#ffcc80"></div>
      </div>
      <div class="star-label" style="--glow-color:#ffcc80">Siempre</div>
    </div>

  </div>

  <div id="footer">
    <div class="footer-text">escrito entre las estrellas, para ti 💕</div>
  </div>
</div>

<!-- ══ OVERLAY CARTA ══ -->
<div id="letter-overlay">
  <div class="letter-card" id="letter-card">
    <div class="letter-star-deco" id="letter-deco">⭐</div>
    <button class="letter-close" id="letter-close">✕</button>
    <div class="letter-title"  id="letter-title"></div>
    <div class="letter-divider"><span id="letter-div-emoji">✨</span></div>
    <div class="letter-body"   id="letter-body"></div>
    <div class="letter-sign"   id="letter-sign"></div>
    <div class="letter-border" id="letter-border"></div>
  </div>
</div>

<script>
  // ── Datos cartas ──
  const letters = {
    1: { deco:'💕', decoColor:'#ff85c2', title:'Amor', div:'💗',
      body:`<p>Contigo aprendí que el amor no grita, susurra. Se siente en los abrazos que no quieres soltar y en las miradas que no necesitan palabras.</p><p>Eres mi amor, mi razón de amar y querer amarte y darte todo. mi niña tan linda.</p>`,
      sign:'Con todo, Fer 💕', borderColor:'#ff85c2,#e8569a,#c2185b,#e8569a,#ff85c2' },
    2: { deco:'😊', decoColor:'#ffd966', title:'Risa', div:'✨',
      body:`<p>Me gusta mucho cómo ríes, como se ilumina mi vida al ver tu sonrisa y verte siendo tu misma me hace quererte aún mas .</p><p>Quiero seguir viendo tu risa y poder estar para presenciar cada vez tu linda y hermosa sonrisa.</p>`,
      sign:'Tu Fer 😊', borderColor:'#ffe066,#f9a825,#e65100,#f9a825,#ffe066' },
    3: { deco:'🕊️', decoColor:'#80d8ff', title:'Calma', div:'🌿',
      body:`<p>En los días en que todo pesa y el mundo se siente muy ruidoso, pienso en ti y todo se hace más ligero.</p><p>Eres mi calma , Angela mi amor eterno. La que no necesita decir nada para existir.</p><p>Quiero estar siempre para ver tu brillo y poder celebrar todo lo que logres y te propongas mi niña hermosa mi amor linda.</p>`,
      sign:'Siempre, Fer 🕊️', borderColor:'#80d8ff,#29b6f6,#0277bd,#29b6f6,#80d8ff' },
    4: { deco:'🏠', decoColor:'#ce93d8', title:'Hogar', div:'🌸',
      body:`<p>No siempre el hogar es un lugar. A veces es una persona, una voz, una presencia que te hace sentir segura.</p><p>Tú eres mi hogar, Angela. Donde esté contigo, ahí es donde quiero estar.</p>`,
      sign:'Fer, siempre tuyo 🏠', borderColor:'#ce93d8,#ab47bc,#6a1b9a,#ab47bc,#ce93d8' },
    5: { deco:'✨', decoColor:'#a5f3a5', title:'Magia', div:'💫',
      body:`<p>Hay algo mágico en cómo cambia todo desde que estás en mi vida. Los días se ven distintos, más bonitos, más vivos.</p><p>Esa magia eres tú,Solo tú.</p>`,
      sign:'Con amor, Fer ✨', borderColor:'#a5f3a5,#66bb6a,#2e7d32,#66bb6a,#a5f3a5' },
    6: { deco:'🌟', decoColor:'#ffcc80', title:'Siempre', div:'💕',
      body:`<p>Si pudiera volver al principio, te elegiría otra vez. Y otra. Todas las veces que hicieran falta.</p><p>Gracias por ser tan especial, Angela. Te quiero hoy, mañana y siempre — entre las estrellas y más allá. 🌸</p>`,
      sign:'Para siempre, Fer 🌟', borderColor:'#ffcc80,#ffa726,#e65100,#ffa726,#ffcc80' },
  };

  // ── Fondo: nebulas ──
  const nebulaData = [
    {x:'15%',y:'20%',r:'35vw',color:'#3a0a5a',op:0.12,dur:'12s'},
    {x:'80%',y:'60%',r:'30vw',color:'#0a2a5a',op:0.10,dur:'15s'},
    {x:'50%',y:'85%',r:'25vw',color:'#1a0a4a',op:0.08,dur:'10s'},
    {x:'90%',y:'10%',r:'20vw',color:'#2a0a3a',op:0.09,dur:'14s'},
  ];
  nebulaData.forEach(n => {
    const el = document.createElement('div');
    el.className = 'nebula';
    el.style.cssText = `
      left:${n.x};top:${n.y};
      width:${n.r};height:${n.r};
      background:radial-gradient(circle,${n.color} 0%,transparent 70%);
      --op:${n.op};
      animation-duration:${n.dur};
      transform:translate(-50%,-50%);
    `;
    document.getElementById('space').appendChild(el);
  });

  // ── Fondo: estrellas ──
  const starColors = ['#ffffff','#ffecff','#ffe8cc','#cce8ff','#eeccff','#ccffee'];
  for (let i = 0; i < 220; i++) {
    const s = document.createElement('div');
    s.className = 'bg-star';
    const size = Math.random()*2+0.3;
    const color = starColors[Math.floor(Math.random()*starColors.length)];
    s.style.cssText = `
      width:${size}px;height:${size}px;
      top:${Math.random()*100}vh;left:${Math.random()*100}vw;
      background:${color};
      box-shadow:0 0 ${size*4}px ${color};
      animation-duration:${1.2+Math.random()*3.5}s;
      animation-delay:${Math.random()*5}s;
    `;
    document.getElementById('space').appendChild(s);
  }

  // ── Planetas decorativos ──
  const planetData = [
    {top:'12%',right:'5%',size:'clamp(30px,7vw,55px)',bg:'radial-gradient(circle at 35% 35%,#f48fb1,#c2185b,#880e4f)',dur:'9s',shadow:'rgba(200,50,100,0.4)'},
    {top:'75%',left:'3%', size:'clamp(20px,5vw,38px)',bg:'radial-gradient(circle at 35% 35%,#b3e5fc,#0288d1,#01579b)',dur:'11s',shadow:'rgba(50,150,220,0.4)'},
  ];
  planetData.forEach(p => {
    const el = document.createElement('div');
    el.className = 'planet';
    el.style.cssText = `
      top:${p.top||'auto'};
      ${p.right?`right:${p.right};`:''}
      ${p.left?`left:${p.left};`:''}
      width:${p.size};height:${p.size};
      background:${p.bg};
      box-shadow:0 0 20px ${p.shadow},0 0 40px ${p.shadow};
      animation-duration:${p.dur};
    `;
    document.getElementById('space').appendChild(el);
  });

  // ── Estrellas fugaces ──
  function spawnShooting() {
    const s = document.createElement('div');
    s.className = 'shooting-star';
    const len = 60+Math.random()*100;
    const colors = ['#ffffff','#ffecff','#fff9c4','#cce8ff'];
    s.style.cssText = `
      top:${Math.random()*50}vh;left:${Math.random()*60}vw;
      width:${len}px;
      background:linear-gradient(90deg,${colors[Math.floor(Math.random()*colors.length)]},transparent);
      animation-duration:${0.5+Math.random()*0.5}s;
    `;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1200);
  }
  setInterval(spawnShooting, 2800);

  // ── Abrir carta ──
  const overlay = document.getElementById('letter-overlay');
  const card    = document.getElementById('letter-card');

  document.querySelectorAll('.star-btn').forEach(btn => {
    function openLetter(e) {
      const id   = parseInt(btn.dataset.id);
      const data = letters[id];

      document.getElementById('letter-deco').textContent  = data.deco;
      document.getElementById('letter-deco').style.filter = `drop-shadow(0 0 12px ${data.decoColor})`;
      document.getElementById('letter-title').textContent = data.title;
      document.getElementById('letter-title').style.color = data.decoColor === '#ffd966' ? '#b07800' : data.decoColor === '#a5f3a5' ? '#2e7d32' : '#7020b0';
      document.getElementById('letter-div-emoji').textContent = data.div;
      document.getElementById('letter-body').innerHTML    = data.body;
      document.getElementById('letter-sign').textContent  = data.sign;
      document.getElementById('letter-border').style.background = `linear-gradient(90deg,${data.borderColor})`;

      overlay.classList.add('open');

      // Partículas
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top  + rect.height/2;
      const emojis = ['⭐','💫','✨','🌟','💕','🌸'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'pop-particle';
        const angle = (i/12)*Math.PI*2;
        const dist  = 55+Math.random()*70;
        p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        p.style.cssText = `
          left:${cx}px;top:${cy}px;
          font-size:${0.9+Math.random()*0.9}rem;
          --tx:${Math.cos(angle)*dist}px;
          --ty:${Math.sin(angle)*dist-15}px;
          --rot:${Math.random()*60-30}deg;
        `;
        document.body.appendChild(p);
        setTimeout(()=>p.remove(), 1000);
      }
    }
    btn.addEventListener('click',    openLetter);
    btn.addEventListener('touchend', e=>{ e.preventDefault(); openLetter(e.changedTouches[0]); },{passive:false});
  });

  // ── Cerrar ──
  function close() { overlay.classList.remove('open'); }
  document.getElementById('letter-close').addEventListener('click', close);
  document.getElementById('letter-close').addEventListener('touchend', e=>{ e.preventDefault(); close(); },{passive:false});
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
</script>
</body>
</html>
